<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog | AH Zubayer</title><meta name="description" content="Notes on web design, development and SEO."><meta property="og:title" content="Blog | AH Zubayer"><meta property="og:description" content="Notes on web design, development and SEO.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2300de51'/><text x='50' y='68' font-size='52' font-weight='800' text-anchor='middle' fill='%23041'>AH</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head><body><div id="nav"></div><main>
<section><div class="w"><h1 style="font-size:clamp(40px,7vw,80px)">Blog</h1><p class="lead">Notes on building better websites.</p><div id="list" style="display:grid;gap:20px;margin-top:40px"><p class="mu">Loading posts...</p></div></div></section>
<script>fetch('/api/posts').then(r=>r.json()).then(p=>{list.innerHTML=p.length?p.map(x=>`<article class="card post" onclick="this.classList.toggle('open')"><span class="mu">${esc(x.created_at.slice(0,10))}</span><h3>${esc(x.title)}</h3><p class="mu">${esc(x.excerpt)}</p><div class="body">${esc(x.body)}</div></article>`).join(''):'<p class="mu">No posts yet.</p>'}).catch(()=>list.innerHTML='<p class="mu">Could not load posts.</p>')</script>
</main><div id="foot"></div><script src="/js/app.js"></script>
</body></html>
