<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | AH Zubayer</title><meta name="description" content="Contact AH Zubayer to start your website project."><meta property="og:title" content="Contact | AH Zubayer"><meta property="og:description" content="Contact AH Zubayer to start your website project.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2300de51'/><text x='50' y='68' font-size='52' font-weight='800' text-anchor='middle' fill='%23041'>AH</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head><body><div id="nav"></div><main>
<section><div class="w g2"><div><h1 style="font-size:clamp(40px,7vw,80px)">Let's build it</h1><p class="lead">Tell me about your project. I reply within 24 hours.</p><p style="margin-top:28px">hello@ahzubayer.com</p></div>
<form id="f"><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required><input class="hp" name="website" tabindex="-1" autocomplete="off"><textarea name="body" placeholder="What do you need?" required></textarea><button class="btn p">Send message</button><div id="r"></div></form></div></section>
<script>f.onsubmit=async e=>{e.preventDefault();const {ok,d}=await post('/api/contact',Object.fromEntries(new FormData(f)));r.className='msg '+(ok?'ok':'er');r.textContent=ok?'Message sent. I will reply soon.':(d.error||'Could not send.');if(ok)f.reset()}</script>
</main><div id="foot"></div><script src="/js/app.js"></script>
</body></html>
