<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin | AH Zubayer</title>
<link rel="stylesheet" href="/css/style.css"><style>.w{max-width:1200px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600}.sc{overflow-x:auto}.k{font:700 40px 'Bricolage Grotesque'}.tabs{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}.tabs button.on{background:var(--ac);color:#04200d}.bars div{display:flex;align-items:flex-end;gap:6px;height:120px}.bars i{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:3px}.row2{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}</style></head><body>
<div class="w" style="padding-top:32px;padding-bottom:64px">
<div id="login" style="max-width:380px;margin:12vh auto"><h2>Admin login</h2><form id="lf"><input id="pw" type="password" placeholder="Password" required><button class="btn p">Log in</button><div id="le"></div></form></div>
<div id="app" hidden><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Dashboard</h2><button class="btn" onclick="fetch('/api/admin/logout').then(()=>location.reload())">Log out</button></div>
<div class="tabs"><button class="btn on" data-t="stats">Visitors</button><button class="btn" data-t="msgs">Messages</button><button class="btn" data-t="posts">Blog posts</button></div>
<div id="stats"></div><div id="msgs" hidden></div>
<div id="posts" hidden><form id="pf" class="card"><input type="hidden" id="pid"><input id="pt" placeholder="Title" required><input id="pe" placeholder="Short excerpt"><textarea id="pb" placeholder="Post text" required></textarea><div><button class="btn p">Save post</button> <button type="button" class="btn" onclick="pf.reset();pid.value=''">Clear</button></div></form><div id="pl" style="margin-top:20px;display:grid;gap:12px"></div></div></div></div>
<script>
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(p,o)=>fetch('/api/admin/'+p,o).then(async r=>{if(r.status===401)throw 0;return r.json()});
const post=(p,b)=>api(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
$('lf').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('pw').value})});if(r.ok)init();else $('le').innerHTML='<div class="msg er">'+E((await r.json()).error)+'</div>'};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));['stats','msgs','posts'].forEach(t=>$(t).hidden=t!==b.dataset.t)});
const list=(a)=>a.map(x=>`<div class="row2"><span>${E(x.k)}</span><b>${x.n}</b></div>`).join('')||'<p class="mu">No data yet</p>';
async function init(){try{const s=await api('stats');$('login').hidden=true;$('app').hidden=false;
const mx=Math.max(1,...s.daily.map(d=>d.n));
$('stats').innerHTML=`<div class="g3"><div class="card"><div class="k">${s.total}</div><span class="mu">Page views</span></div><div class="card"><div class="k">${s.unique}</div><span class="mu">Unique visitors</span></div><div class="card"><div class="k">${s.today}</div><span class="mu">Views today</span></div></div>
<div class="card bars" style="margin-top:24px"><h3>Last 14 days</h3><div>${s.daily.map(d=>`<i title="${d.k}: ${d.n}" style="height:${d.n/mx*100}%"></i>`).join('')}</div></div>
<div class="g2" style="margin-top:24px"><div class="card"><h3>Top pages</h3>${s.pages.map(x=>`<div class="row2"><span>${E(x.k)}</span><b>${x.n} <small class="mu">${x.avg||0}s avg</small></b></div>`).join('')}</div><div class="card"><h3>Countries</h3>${list(s.countries)}</div><div class="card"><h3>Devices</h3>${list(s.devices)}</div><div class="card"><h3>Sources</h3>${list(s.refs)}</div></div>
<div class="card" style="margin-top:24px"><h3>Latest website audits</h3>${s.audits.map(a=>`<div class="row2"><span>${E(a.url)}</span><b>${a.score}/100</b></div>`).join('')||'<p class="mu">None yet</p>'}</div>
<div class="card sc" style="margin-top:24px"><h3>Recent visits</h3><table><tr><th>Time (UTC)</th><th>Page</th><th>Location</th><th>Device</th><th>Browser / OS</th><th>Source</th><th>Time on page</th><th>Visitor</th></tr>${s.recent.map(v=>`<tr><td>${E(v.created_at)}</td><td>${E(v.path)}</td><td>${E([v.city,v.country].filter(Boolean).join(', '))}</td><td>${E(v.device)}</td><td>${E(v.browser)} / ${E(v.os)}</td><td>${E(v.referrer||'Direct')}</td><td>${v.duration||0}s</td><td>${E(v.vid.slice(0,6))}</td></tr>`).join('')}</table></div>`;
loadM();loadP()}catch{}}
async function loadM(){const m=await api('messages');$('msgs').innerHTML=m.map(x=>`<div class="card" style="margin-bottom:12px"><b>${E(x.name)}</b> <a class="mu" href="mailto:${E(x.email)}">${E(x.email)}</a> <span class="mu">${E(x.created_at)}</span><p style="white-space:pre-wrap;margin:8px 0">${E(x.body)}</p><button class="btn" onclick="del('messages',${x.id})">Delete</button></div>`).join('')||'<p class="mu">No messages yet.</p>'}
let P=[];async function loadP(){P=await api('posts');$('pl').innerHTML=P.map(x=>`<div class="card"><b>${E(x.title)}</b> <span class="mu">${E(x.created_at.slice(0,10))}</span><div style="margin-top:10px"><button class="btn" onclick="edit(${x.id})">Edit</button> <button class="btn" onclick="del('posts',${x.id})">Delete</button></div></div>`).join('')}
window.edit=id=>{const x=P.find(p=>p.id===id);$('pid').value=x.id;$('pt').value=x.title;$('pe').value=x.excerpt;$('pb').value=x.body;scrollTo(0,0)};
window.del=async(t,id)=>{if(confirm('Delete this?')){await api(t+'?id='+id,{method:'DELETE'});t==='posts'?loadP():loadM()}};
$('pf').onsubmit=async e=>{e.preventDefault();await post('posts',{id:$('pid').value||null,title:$('pt').value,excerpt:$('pe').value,body:$('pb').value});$('pf').reset();$('pid').value='';loadP()};
init();
</script></body></html>
